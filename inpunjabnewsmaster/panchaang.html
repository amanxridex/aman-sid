<html lang="en">

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Daily Panchaang – InPunjab News</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="index.css?v=1.5" rel="stylesheet"/>
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme !== 'dark') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
    <style>
        @keyframes gradientPan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .panchaang-page-wrapper {
            background: linear-gradient(-45deg, rgba(255, 153, 51, 0.08), rgba(255, 255, 255, 1), rgba(219, 39, 119, 0.05), rgba(255, 255, 255, 1));
            background-size: 400% 400%;
            animation: gradientPan 15s ease infinite;
            min-height: calc(100vh - 200px);
            padding: 60px 0;
            position: relative;
            overflow: hidden;
        }
        
        .panchaang-page-wrapper::before {
            content: "🕉️";
            position: absolute;
            top: -100px;
            right: -100px;
            font-size: 400px;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
            transform: rotate(15deg);
        }
        
        .panchaang-page-wrapper::after {
            content: "☀️";
            position: absolute;
            bottom: -50px;
            left: -50px;
            font-size: 300px;
            opacity: 0.02;
            z-index: 0;
            pointer-events: none;
            transform: rotate(-15deg);
        }

        .panchaang-container {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.6);
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        [data-theme="dark"] .panchaang-page-wrapper {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a);
            background-size: 400% 400%;
        }
        [data-theme="dark"] .panchaang-container {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(255,255,255,0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05) inset;
        }

        .panchaang-header {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            background: linear-gradient(135deg, #ff6b00, #ffb800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(255, 107, 0, 0.2);
        }

        .panchaang-subtitle {
            font-size: 14px;
            color: var(--text-muted, #888);
            margin-bottom: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .date-picker-wrapper {
            background: var(--card-bg, #ffffff);
            padding: 10px 25px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid var(--card-border, #eee);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .date-picker-wrapper:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 107, 0, 0.15);
            border-color: rgba(255, 107, 0, 0.3);
        }

        .date-picker-wrapper label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted, #888);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .date-picker-wrapper input {
            padding: 10px;
            font-size: 18px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            color: var(--text-primary, #111);
            outline: none;
            cursor: pointer;
        }
        
        /* Custom calendar icon styling for webkit */
        .date-picker-wrapper input::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
            filter: var(--calendar-filter, none);
        }
        .date-picker-wrapper input::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
        
        [data-theme="dark"] .date-picker-wrapper input::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .panchaang-content {
            font-family: 'Noto Sans Gurmukhi', 'Inter', sans-serif;
            text-align: center;
            padding: 50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: var(--text-secondary, #333);
            box-shadow: inset 0 2px 20px rgba(255, 255, 255, 0.5);
            position: relative;
        }

        [data-theme="dark"] .panchaang-content {
            background: rgba(15, 23, 42, 0.4);
            border-color: rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 20px rgba(0,0,0,0.5);
            color: #e2e8f0;
        }

        .panchaang-line {
            font-size: 20px;
            line-height: 2.2;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(15px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: color 0.3s, transform 0.3s;
        }
        
        .panchaang-line:hover {
            color: var(--text-primary, #000);
            transform: scale(1.01);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .panchaang-content strong {
            color: #ff6b00;
            font-weight: 800;
            padding: 0 4px;
        }
        
        [data-theme="dark"] .panchaang-content strong {
            color: #ffb800;
        }

        .spiritual-divider {
            margin: 40px auto;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ff6b00, transparent);
            border-radius: 2px;
            position: relative;
            opacity: 0;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .spiritual-divider::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, rgba(255,107,0,0.4) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .vichar-box {
            background: linear-gradient(135deg, rgba(255,107,0,0.05), transparent);
            padding: 30px;
            border-radius: 16px;
            margin-top: 30px;
            border: 1px solid rgba(255,107,0,0.1);
            font-style: italic;
            font-size: 22px;
            color: var(--text-primary, #111);
        }
        
        @media (max-width: 768px) {
            .panchaang-page-wrapper { padding: 30px 15px; }
            .panchaang-container { padding: 40px 20px; border-radius: 20px; }
            .panchaang-header { font-size: 38px; }
            .panchaang-content { padding: 30px 15px; }
            .panchaang-line { font-size: 18px; line-height: 1.8; }
            .date-picker-wrapper { width: 100%; justify-content: center; flex-direction: column; gap: 10px; border-radius: 20px; padding: 20px; }
            .date-picker-wrapper input { width: 100%; text-align: center; }
            .vichar-box { font-size: 19px; padding: 20px; }
        }
    </style>
</head>

<script>
    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('themeToggle');
        if (html.getAttribute('data-theme') === 'dark') {
            html.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            if(btn) btn.innerHTML = '☀️';
        } else {
            html.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            if(btn) btn.innerHTML = '🌙';
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('themeToggle');
        if(btn && document.documentElement.getAttribute('data-theme') === 'dark') {
            btn.innerHTML = '🌙';
        }
    });

    // Get current date in IST
    const getISTDateString = () => {

        const istOffset = 5.5 * 60 * 60 * 1000;
        const istTime = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + istOffset);
        
        const year = istTime.getFullYear();
        const month = String(istTime.getMonth() + 1).padStart(2, '0');
        const day = String(istTime.getDate()).padStart(2, '0');

    const renderPanchaang = (dateStr) => {
        if (panchaangData[dateStr]) {
            let rawText = panchaangData[dateStr];
            
            // Format *bold* text
            let formattedText = rawText.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
            
            // Split into lines
            let lines = formattedText.split('\n').filter(line => line.trim() !== '');
            let finalHtml = '';
            
            let inVichar = false;
            
            lines.forEach((line, index) => {
                let delay = index * 0.1;
                
                if (line.includes('<strong>आज का विचार</strong>') || line.includes('<strong>आज का विचार</strong>')) {
                    finalHtml += `<div class="spiritual-divider" style="animation-delay: ${delay}s"></div>`;

                    // Remove the 'आज का विचार -' part and just keep the quote
                    line = line.replace(/<strong>आज का विचार<\/strong>\s*-\s*/, '<strong>✨ आज का विचार ✨</strong><br><br>');
