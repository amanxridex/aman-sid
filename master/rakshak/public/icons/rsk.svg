<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Inner Core Glow Gradient -->
    <linearGradient id="innerCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Bevel Facet Shading -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Dark Obsidian Base Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield Backdrop Silhouette -->
  <path d="M 64 6 
           L 112 24 
           C 112 72, 88 106, 64 122 
           C 40 106, 16 72, 16 24 
           Z" 
        fill="#0B0F19" 
        stroke="url(#shieldCyanPurple)" 
        stroke-width="3" 
        filter="url(#neonGlow)" />

  <!-- Outer Neon Rim -->
  <path d="M 64 13 
           L 105 29 
           C 105 70, 84 99, 64 113 
           C 44 99, 23 70, 23 29 
           Z" 
        fill="#070B14" 
        stroke="url(#shieldCyanPurple)" 
        stroke-width="1.8" 
        stroke-opacity="0.75" />

  <!-- Stylized Geometric Rakshak Monogram 'R' -->
  <!-- Vertical Spine -->
  <polygon points="40,36 53,36 53,92 40,92" 
           fill="url(#shieldCyanPurple)" />
  <polygon points="40,36 47,36 47,92 40,92" 
           fill="url(#bevelLight)" />

  <!-- Upper Loop -->
  <polygon points="53,36 84,36 93,48 84,62 53,62 53,51 77,51 82,48 77,46 53,46" 
           fill="url(#shieldCyanPurple)" />
  <polygon points="53,36 84,36 87,40 53,40" 
           fill="url(#bevelLight)" />

  <!-- Diagonal Strike Leg -->
  <polygon points="53,58 66,58 89,92 76,92" 
           fill="url(#shieldCyanPurple)" />
  <polygon points="66,58 72,58 91,88 89,92" 
           fill="url(#bevelLight)" />

  <!-- Core Neon Energy Node -->
  <circle cx="64" cy="20" r="2.5" fill="#00F5FF" />
  <circle cx="64" cy="116" r="2" fill="#8B5CF6" />
</svg>
