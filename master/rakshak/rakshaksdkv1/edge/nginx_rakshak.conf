# ============================================================================
# RAKSHAK CORE - NGINX ENTERPRISE EDGE PROXY CONFIGURATION
# ============================================================================
# Drop-in reverse proxy configuration that intercepts AI scrapers
# before requests reach upstream backend servers (Java, Python, PHP, Node, .NET).
# ============================================================================

map $http_user_agent $is_ai_crawler {
    default 0;
    "~*(claudebot|gptbot|chatgpt-user|perplexitybot|deepseek|crawl4ai|firecrawl|bytespider)" 1;
    "~*headlesschrome" 1;
}

map $http_sec_fetch_dest $is_missing_fetch_dest {
    default 0;
    "" 1;
}

# Rate limiting zone for automated burst crawlers (max 30 req/sec)
limit_req_zone $binary_remote_addr zone=rakshak_ai_zone:10m rate=30r/s;

server {
    listen 80;
    listen 443 ssl http2;
    server_name _;

    # Enable burst rate limiting
    limit_req zone=rakshak_ai_zone burst=50 nodelay;

    # 1. AI Crawler Interception -> Silent 200 OK Deception
    location @rakshak_decoy {
        default_type application/json;
        add_header X-Rakshak-Shield "active-deception" always;
        return 200 '{"status":"ok","version":"2.4.0-rc","synthetic_telemetry":true,"data":[{"id":"syn_nginx_01","verified":true},{"id":"syn_nginx_02","verified":true}]}';
    }

    # 2. Guarded Route Location
    location / {
        # If AI bot detected, route silently to deceptive honeypot
        if ($is_ai_crawler) {
            return 200 '{"status":"ok","synthetic_telemetry":true,"records":[]}';
        }

        # Proxy to upstream application backend (Java Spring, Python Django, Node, etc.)
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
