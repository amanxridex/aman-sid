<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Bytecode Golden Amber Gradient -->
    <linearGradient id="amberBytecode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Shield Backdrop -->
  <path d="M 64 6 
           L 112 24 
           C 112 72, 88 106, 64 122 
           C 40 106, 16 72, 16 24 
           Z" 
        fill="#130D04" 
        stroke="url(#amberBytecode)" 
        stroke-width="3" 
        filter="url(#amberGlow)" />

  <!-- Inner Amber Perimeter -->
  <path d="M 64 14 
           L 104 30 
           C 104 69, 83 98, 64 112 
           C 45 98, 24 69, 24 30 
           Z" 
        fill="#0A0702" 
        stroke="url(#neonOrange)" 
        stroke-width="1.8" 
        stroke-opacity="0.8" />

  <!-- Circuit Trace Bus Lines -->
  <path d="M 32 44 L 46 44 L 52 52 L 52 76 L 46 84 L 32 84" 
        fill="none" stroke="url(#amberBytecode)" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="44" r="2.5" fill="#FDE047" />
  <circle cx="32" cy="84" r="2.5" fill="#FDE047" />

  <path d="M 96 44 L 82 44 L 76 52 L 76 76 L 82 84 L 96 84" 
        fill="none" stroke="url(#amberBytecode)" stroke-width="2" stroke-linecap="round" />
  <circle cx="96" cy="44" r="2.5" fill="#FDE047" />
  <circle cx="96" cy="84" r="2.5" fill="#FDE047" />

  <!-- Central Binary 'B' Bytecode Monogram -->
  <polygon points="52,38 64,38 64,90 52,90" fill="url(#neonOrange)" />
  <polygon points="64,38 80,38 86,46 80,54 64,54" fill="url(#amberBytecode)" />
  <polygon points="64,54 82,54 88,64 82,74 64,74" fill="url(#amberBytecode)" />
  <polygon points="56,43 62,43 62,49 56,49" fill="#FDE047" />
  <polygon points="56,59 62,59 62,69 56,69" fill="#FDE047" />

  <!-- Binary Byte Matrix Dots (0x52 0x53 0x4B 0x01) -->
  <circle cx="64" cy="22" r="2.5" fill="#FDE047" />
  <circle cx="64" cy="104" r="2.5" fill="#EA580C" />
  <circle cx="64" cy="82" r="1.5" fill="#F59E0B" />
</svg>
